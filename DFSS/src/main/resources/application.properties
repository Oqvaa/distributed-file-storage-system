spring.application.name=DFSS

# Multipart upload limits
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:100MB}

# Storage configuration (run Maven from the DFSS directory by default)
storage.path=${DFSS_OUTPUT_PATH:./Storage/Output/}
storage.nodes.path=${DFSS_NODES_PATH:./Storage/Node}
total.nodes=${DFSS_TOTAL_NODES:3}
chunk.size=${DFSS_CHUNK_SIZE:1048576}

# PostgreSQL connection. Supply credentials through the environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dfss}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
